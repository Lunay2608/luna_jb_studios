<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagen - Luna JB Studios</title>
    <link rel="stylesheet" href="stilos.css">
    <style>
        #img-viewer {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        #img-viewer img {
            max-width: 100%;
            max-height: 600px;
            margin-top: 20px;
            border-radius: 5px;
        }
        #img-caption {
            margin-top: 10px;
            color: #ffffff;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <section id="img-viewer">
        <button class="btn" onclick="window.history.back()">← Regresar</button>
        <div id="contenido">
            <img id="display-img" src="" alt="">
            <p id="img-caption"></p>
        </div>
    </section>

    <script>
        // get image and caption from URL parameters
        const params = new URLSearchParams(window.location.search);
        const imgSrc = params.get('img');
        const caption = params.get('caption');

        if (imgSrc) {
            document.getElementById('display-img').src = imgSrc;
            document.getElementById('img-caption').textContent = decodeURIComponent(caption || '');
        } else {
            document.getElementById('contenido').innerHTML = '<p>No se encontró imagen.</p>';
        }
    </script>
</body>
</html>
